<div class="main_display">
   <form class="form">
    <div class="h1 my-3 d-flex justify-content-center">Personal Info</div>
  <div class="form-group row my-3">
    <label for="Email" class="col-sm-2 col-form-label">Email</label>
    <div class="col-sm-10">
      <input type="email" class="form-control" id="Email" placeholder="Email">
      <small id="emailHelp" class="form-text text-dark">We'll never share your email with anyone else.</small>
    </div>
  </div>

  <div class="form-group row my-3">
    <label for="Username" class="col-sm-2 col-form-label">Username</label>
    <div class="col-sm-10">
      <input type="Username" class="form-control" id="Password" placeholder="Username">
    </div>
  </div>

  <div class="form-group row my-3">
<label for="Bio" class="col-sm-2 col-form-label">Bio</label>
    <div class="col-sm-10">
<textarea class="form-control" id="Bio" rows="5" placeholder="Bio"></textarea>
    </div>
</div>



  
  <div class="form-group row my-5 d-flex justify-content-end">
    <div class="col-sm-10">
      <button type="update" class="btn btn-info">Update</button>
      <button type="button" class="btn btn-info" data-bs-toggle="modal" 
    data-bs-target="#change">Change Password</button>
    <div class="my-2 fake-button bg-danger">  
  <a href="../starter/index.html" class="text-decoration-none text-white">Log Out</a>
  </div>
    </div>
  </div>
</form>

<div 
        class="modal fade" 
        id="change" 
        aria-hidden="true" 
        aria-labelledby="change_label" 
        tabindex="-1">

  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" 
        id="change_label">
          Change Password
        </h1>
        <button type="button" 
        class="btn-close" 
        data-bs-dismiss="modal" 
        aria-label="Close"></button>
      </div>
      
      <div class="modal-body">
        <form>
          <div class="form-group my-3">
            <label for="password">
              Current Password
            </label>
            <input type="password" 
            class="form-control" 
            id="current-password" 
            aria-describedby="emailHelp" 
            placeholder="Current password">
          </div>
  
          <div class="form-group my-3">
            <label for="password">
              New Password
            </label>
            <input type="password" 
            class="form-control" 
            id="new-password" 
            placeholder="New password">
          </div>

          <div class="form-group my-3">
            <label for="password">
              Confirm New Password
            </label>
            <input type="password" 
            class="form-control" 
            id="confirm" 
            placeholder="Confirm new password">
          </div>

<br>

          <div class="my-2 button">
            <button 
            type="button" 
            class="btn btn-info" 
            data-bs-toggle="modal" 
            data-bs-target="#success">
              Confirm
            </button>  
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div 
class="modal fade" 
id="success" 
aria-hidden="true" 
aria-labelledby="success_label" 
tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 
        class="modal-title fs-5" 
        id="success_label">
          Password changed successfully!!!
        </h1>
        <button 
        type="button" 
        class="btn-close" 
        data-bs-dismiss="modal" 
        aria-label="Close"></button>
      </div>
  </body>
