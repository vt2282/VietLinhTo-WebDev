<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>seeSHOWS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"

      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    >
  </script>
    
  
<!-- MAIN DISPLAY -->
        <div class="vw-100 vh-100 main_display">
<div class="description mt-5">Making live theatre more accessible!</div>
            <div class="mx-auto seashell"><img src="../img/clam.png" class="rounded img-fluid" alt="Cartoon slightly opened clam shell with eyes"></div>
          <h1 class="heading">seeSHOWS</h1>
            <div class="d-grid gap-3 col-3 mx-auto mt-5">
              <button class="btn account" type="button" data-bs-toggle="modal" 
                data-bs-target="#log_in">Log In</button>
              <button class="btn account" type="button"data-bs-toggle="modal" 
                data-bs-target="#sign_up">Sign Up</button>
            </div>
            <div class="description mt-3">Wanna see more live shows in your city? We can help!</div>

        </div>

  <div 
        class="modal fade" 
        id="log_in" 
        aria-hidden="true" 
        aria-labelledby="log_in_label" 
        tabindex="-1">

  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="log_in_label">Nice to 'see' you again!</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
  <div class="form-group my-2">
    <label for="email">Email Address</label>
    <input type="email" class="form-control" id="email" aria-describedby="emailHelp" placeholder="Email" required>
  </div>
  
<div class="form-group my-2">
    <label for="password">Password</label>
    <input type="password" class="form-control" id="password" placeholder="Password">
  </div>

  <div class="form-group form-check">
    <input type="checkbox" class="form-check-input" id="Check">
    <label class="form-check-label" for="Check">Remember me</label>
  </div>
  <br>
<button type="button" class="btn btn-info" onclick="login()">Log In</button> 
</form>
      </div>
    </div>
  </div>
</div>

<script>
  function login() {
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();


  }
  if (!username || !email || !password) {
    message.className = "error";
    message.textContent = "All fields are required!";
    return;
  }
</script>

<!-- SIGN UP MODAL -->
     <div 
        class="modal fade" 
        id="sign_up" 
        aria-hidden="true" 
        aria-labelledby="sign_up_label" 
        tabindex="-1">

  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
  
      <div class="modal-header">
        <h1 
        class="modal-title fs-5" 
        id="sign_up_label">
          Welcome to seeSHOWS!
        </h1>
        <button 
        type="button" 
        class="btn-close" 
        data-bs-dismiss="modal" 
        aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form>
          <div class="form-group my-2">
            <label for="email">
              Email Address
            </label>
            <input 
            type="email" 
            class="form-control" 
            id="email" 
            aria-describedby="emailHelp" 
            placeholder="Enter email">
        </div>

        <div class="form-group my-2">
          <label for="username">
            Username
          </label>
          <input 
          type="username" 
          class="form-control" 
          id="username" 
          placeholder="Username">
        </div>

        <div class="form-group my-2">
          <label for="password">
            Password
          </label>
        <input 
        type="password" 
        class="form-control" 
        id="password" 
        placeholder="Password">
      </div>

<br>

      <button 
      type="button" 
      class="btn btn-info" 
      onclick="signup()">
        Sign Up
      </button>  
    </div>

  <div class="note">
    <small>Already have an account?</small>
    <button 
    class="btn switch" 
    type="button" 
    data-bs-toggle="modal" 
    data-bs-target="#log_in">
      Log In
    </button>
  </div>
</form>
      </div>
    </div>
  </div>
</div>

<script>
  function login() {
  const email = document.querySelector("#log_in input[type='email']").value.trim();
  const password = document.querySelector("#log_in input[type='password']").value.trim();

  if (!email || !password) {
    alert("All fields are required!");
    return;
  }

  window.location.href = "../home/index.html";
}

function signup() {
  const email = document.querySelector("#sign_up input[type='email']").value.trim();
  const username = document.querySelector("#sign_up input[type='username']").value.trim();
  const password = document.querySelector("#sign_up input[type='password']").value.trim();

  if (!email || !username || !password) {
    alert("All fields are required!");
    return;
  }
  window.location.href = "../home/index.html";
}
</script>
        
  </body>
</html>
