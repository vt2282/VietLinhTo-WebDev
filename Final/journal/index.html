<!-- MAIN DISPLAY-->

<div class="vw-100 vh-100 main_display">
  <div class="heading">Track & review every show you have seen!</div>
    <div class="container">
        <input id="titleInput" placeholder="Show Title">
        <input id="venueInput" placeholder="Venue">
        <input id="dateInput" type="date">

<br>

    <div>  
      <textarea id="reviewInput" 
      placeholder="Your review"></textarea>
    </div>

<br>

      <button onclick="addReview()">
        Add Review
      </button>
    </div>

    <div id="reviewList"></div>
</div>

<script>

// CREATE REVIEWS LOCAL STORAGE & CONVERT JSON STRING
  let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

// RENDER REVIEWS ON TO THE PAGE
function renderReviews() {
  const list = document.getElementById("reviewList");
  list.innerHTML = "";

// WHAT DOES EACH REVIEW DO?
  reviews.forEach((review, index) => {
    const revDiv = document.createElement("revDiv");
      revDiv.className = "review-card";

    revDiv.innerHTML = `
      <h3>${review.title}</h3>
      <p><strong>Venue:</strong> ${review.venue}</p>
      <p><strong>Date Watched:</strong> ${review.date}</p>
      <p class="review-text">${review.text}</p>

      <div class="actions">
        <button onclick="deleteReview(${index})">Delete</button>
      </div>
    `;
// PUT EACH REVIEW INTO LIST
    list.appendChild(revDiv);
  });

  localStorage.setItem("reviews", JSON.stringify(reviews));
}

// ADD REVIEW BUTTON
function addReview() {
  const title = document.getElementById("titleInput").value.trim();
  const venue = document.getElementById("venueInput").value.trim();
  const date = document.getElementById("dateInput").value;
  const text = document.getElementById("reviewInput").value.trim();

  if (!title || !venue || !date || !text) {
    alert("Please fill in all fields");
    return;
  }

// ALLOW USER TO WRITE EACH ENTRY & HAVE THEM SHOWN ON SCREEN
  const review = {
    title,
    venue,
    date,
    text
  };

  reviews.push(review);

  document.getElementById("titleInput").value = "";
  document.getElementById("venueInput").value = "";
  document.getElementById("dateInput").value = "";
  document.getElementById("reviewInput").value = "";

  renderReviews();
}

// DELETE REVIEW
function deleteReview(index) {
  reviews.splice(index, 1);
  renderReviews();
}

renderReviews();
</script>
